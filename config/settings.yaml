# הגדרות מערכת. אם משהו פה לא ברור — תשאל את אליק.

digest:
  # הדוח היומי: כל בוקר ב-7:00 (שעון ישראל). כבוי? תשנה ל-false.
  enabled: true
  hour: 7 # שעה בבוקר (שעון ישראל)
  minute: 0
  max_videos: 10 # כמה סרטונים לנתח בכל בוקר
  deadman_minute: 30 # אם לא יצא דוח עד 07:30 — תתריע לאליק

  # הרדאר (הטבלה של ארז): ישראל/עולם × רגשי/כללי. 3+3+2+2 = 10 —
  # אותם 10 סרטונים ביום, רק מחולקים לארבעה ריבועים במקום רשימה אחת.
  radar:
    emotional_per_region: 3 # סרטונים רגשיים (ניתוח מלא) לכל אזור
    general_per_region: 2 # טרנדים כלליים (שורה אחת, בלי ניתוח) לכל אזור
    probe_per_region: 5 # כמה סרטונים מהצ'ארט לבדוק עם Gemini בכל אזור — זה מד העלות

collect:
  lookback_hours: 48 # כמה אחורה לחפש סרטונים חדשים
  max_per_creator: 5

cost:
  monthly_cap_usd: 40 # החודש הראשון
